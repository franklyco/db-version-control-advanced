<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>R3 Brand Control Center - happy path at 1440x900</title>
  <desc>Wireframe placeholder showing the drawer geometry, tabs, filter chips, row list, footer, and site backdrop at 1440x900. Not a pixel-accurate PNG capture — see screenshots/README.md.</desc>

  <!-- Site backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#e6e9f2"/>
  <rect x="0" y="0" width="1440" height="32" fill="#1d2327"/>
  <text x="16" y="21" fill="#dcdcde" font-size="12" font-weight="500">WordPress · Greenfield Landscapes · Howdy, Rhett</text>

  <!-- Site header -->
  <rect x="0" y="32" width="1440" height="88" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="82" fill="#28324a" font-size="17" font-weight="800" letter-spacing="-0.2">Greenfield Landscapes</text>
  <text x="1000" y="82" fill="#5a627a" font-size="13">Services   Projects   About   Blog   Contact</text>
  <rect x="1290" y="60" width="120" height="40" rx="10" fill="#28324a"/>
  <text x="1320" y="86" fill="#ffffff" font-size="12" font-weight="600">Get a Quote</text>

  <!-- Site hero (behind drawer) -->
  <text x="560" y="240" fill="#8a94b3" font-size="10" font-weight="800" letter-spacing="1.5">LIVE SITE · VISIBLE BESIDE THE DRAWER</text>
  <text x="560" y="310" fill="#3b476b" font-size="40" font-weight="800" letter-spacing="-0.8">Garden design that</text>
  <text x="560" y="360" fill="#3b476b" font-size="40" font-weight="800" letter-spacing="-0.8">grows with you.</text>
  <text x="560" y="400" fill="#6b7796" font-size="13" font-weight="500">The drawer sits on the left edge without a backdrop so the site stays readable on the right.</text>

  <!-- Drawer shell — anchored top-left, 480 wide, top=32 (admin bar), bottom=824 (900 - 76 toolbar strip) -->
  <g>
    <rect x="0" y="32" width="480" height="792" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Header -->
    <rect x="0" y="32" width="480" height="60" fill="#f6f7fd"/>
    <rect x="18" y="46" width="36" height="36" rx="10" fill="#f0f3ff"/>
    <text x="66" y="65" fill="#001673" font-size="15" font-weight="800">Brand Controls</text>
    <text x="66" y="82" fill="#5a627a" font-size="11">33 registered · 19 ready to open</text>
    <text x="454" y="70" font-size="20" fill="#5a627a" text-anchor="end">×</text>
    <line x1="0" y1="92" x2="480" y2="92" stroke="#e2e8f0"/>

    <!-- Tab strip -->
    <g font-size="12" font-weight="600">
      <rect x="18" y="102" width="70" height="26" rx="13" fill="#001673"/>
      <text x="30" y="119" fill="#ffffff">All 33</text>
      <text x="98" y="119" fill="#5a627a">Brand 6</text>
      <text x="158" y="119" fill="#5a627a">Contact 5</text>
      <text x="226" y="119" fill="#5a627a">Content 4</text>
      <text x="290" y="119" fill="#5a627a">Design 6</text>
      <text x="352" y="119" fill="#5a627a">Layout 5</text>
      <text x="410" y="119" fill="#5a627a">Legal 3</text>
    </g>
    <line x1="0" y1="140" x2="480" y2="140" stroke="#e2e8f0"/>

    <!-- Filter strip -->
    <rect x="0" y="140" width="480" height="90" fill="#f4f6fd"/>
    <rect x="18" y="152" width="444" height="30" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="30" y="171" fill="#8a94b3" font-size="12">Search controls…</text>

    <g font-size="10" font-weight="800" letter-spacing="0.6">
      <text x="18" y="200" fill="#5a627a">STATUS</text>
      <rect x="65" y="188" width="66" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="72" y="200" fill="#5a627a">AVAILABLE</text>
      <rect x="135" y="188" width="60" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="142" y="200" fill="#5a627a">VIEW ONLY</text>
      <text x="18" y="222" fill="#5a627a">PRIORITY</text>
      <rect x="70" y="210" width="34" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="76" y="222" fill="#5a627a">MUST</text>
      <rect x="108" y="210" width="46" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="114" y="222" fill="#5a627a">SHOULD</text>
      <rect x="158" y="210" width="34" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="164" y="222" fill="#5a627a">NICE</text>
    </g>
    <line x1="0" y1="230" x2="480" y2="230" stroke="#e2e8f0"/>

    <!-- Column header (sticky) -->
    <rect x="0" y="230" width="480" height="30" fill="#f4f6fd"/>
    <text x="18" y="249" font-size="10" fill="#5a627a" font-weight="800" letter-spacing="0.8">CONTROL</text>

    <!-- Rows -->
    <g font-family="-apple-system, sans-serif">
      <!-- Row 1: Primary Logo, available -->
      <line x1="0" y1="260" x2="480" y2="260" stroke="#e2e8f0"/>
      <circle cx="24" cy="278" r="4" fill="#0f766e"/>
      <text x="36" y="282" font-size="13" font-weight="600" fill="#001673">Primary Logo</text>
      <text x="36" y="298" font-size="11" fill="#5a627a">Brand · Identity ·</text>
      <rect x="128" y="290" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="134" y="300" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">SHARED GLOBAL</text>
      <text x="36" y="313" font-size="11" fill="#8a94b3">option/acf_options · image</text>
      <rect x="404" y="273" width="58" height="22" rx="10" fill="#ff5b21"/>
      <text x="422" y="288" font-size="12" font-weight="600" fill="#ffffff">Open</text>

      <!-- Row 2: Secondary Logo -->
      <line x1="0" y1="325" x2="480" y2="325" stroke="#e2e8f0"/>
      <circle cx="24" cy="343" r="4" fill="#0f766e"/>
      <text x="36" y="347" font-size="13" font-weight="600" fill="#001673">Secondary / Wordmark Logo</text>
      <text x="36" y="363" font-size="11" fill="#5a627a">Brand · Identity ·</text>
      <rect x="160" y="355" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="166" y="365" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">SHARED GLOBAL</text>
      <text x="36" y="378" font-size="11" fill="#8a94b3">option/acf_options · image</text>
      <rect x="404" y="338" width="58" height="22" rx="10" fill="#ff5b21"/>
      <text x="422" y="353" font-size="12" font-weight="600" fill="#ffffff">Open</text>

      <!-- Row 3: Short bio, inspect_only -->
      <line x1="0" y1="390" x2="480" y2="390" stroke="#e2e8f0"/>
      <circle cx="24" cy="408" r="4" fill="#1e3a8a"/>
      <text x="36" y="412" font-size="13" font-weight="600" fill="#001673">Short "About" Blurb</text>
      <text x="36" y="428" font-size="11" fill="#5a627a">Brand · Voice ·</text>
      <rect x="128" y="420" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="134" y="430" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">SHARED GLOBAL</text>
      <text x="36" y="443" font-size="11" fill="#8a94b3">option/acf_options · other</text>
      <rect x="404" y="403" width="58" height="22" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="422" y="418" font-size="12" font-weight="600" fill="#001673">View</text>

      <!-- Row 4: Accent Color, unsupported -->
      <line x1="0" y1="455" x2="480" y2="455" stroke="#e2e8f0"/>
      <circle cx="24" cy="473" r="4" fill="#92400e"/>
      <text x="36" y="477" font-size="13" font-weight="600" fill="#001673" opacity="0.7">Accent Color</text>
      <text x="36" y="493" font-size="11" fill="#5a627a" opacity="0.7">Brand · Palette ·</text>
      <rect x="130" y="485" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d" opacity="0.7"/>
      <text x="136" y="495" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5" opacity="0.7">SHARED GLOBAL</text>
      <text x="36" y="508" font-size="11" fill="#8a94b3" opacity="0.7">option/acf_options · other</text>
      <text x="462" y="479" font-size="10" font-weight="800" fill="#8a94b3" text-anchor="end" letter-spacing="0.5">UNSUPPORTED</text>

      <!-- Row 5: Primary Phone, available -->
      <line x1="0" y1="520" x2="480" y2="520" stroke="#e2e8f0"/>
      <circle cx="24" cy="538" r="4" fill="#0f766e"/>
      <text x="36" y="542" font-size="13" font-weight="600" fill="#001673">Primary Phone Number</text>
      <text x="36" y="558" font-size="11" fill="#5a627a">Contact · Reach ·</text>
      <rect x="140" y="550" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="146" y="560" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">SHARED GLOBAL</text>
      <text x="36" y="573" font-size="11" fill="#8a94b3">option/acf_options · other</text>
      <rect x="404" y="533" width="58" height="22" rx="10" fill="#ff5b21"/>
      <text x="422" y="548" font-size="12" font-weight="600" fill="#ffffff">Open</text>

      <!-- Row 6: Featured Posts, available -->
      <line x1="0" y1="585" x2="480" y2="585" stroke="#e2e8f0"/>
      <circle cx="24" cy="603" r="4" fill="#0f766e"/>
      <text x="36" y="607" font-size="13" font-weight="600" fill="#001673">Default "Featured Posts" Collection</text>
      <text x="36" y="623" font-size="11" fill="#5a627a">Content · Featured ·</text>
      <rect x="164" y="615" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
      <text x="170" y="625" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">SHARED GLOBAL</text>
      <text x="36" y="638" font-size="11" fill="#8a94b3">option/acf_options · relationship</text>
      <rect x="404" y="598" width="58" height="22" rx="10" fill="#ff5b21"/>
      <text x="422" y="613" font-size="12" font-weight="600" fill="#ffffff">Open</text>

      <!-- Row 7: Press Grid, unavailable -->
      <line x1="0" y1="650" x2="480" y2="650" stroke="#e2e8f0"/>
      <circle cx="24" cy="668" r="4" fill="orangered"/>
      <text x="36" y="672" font-size="13" font-weight="600" fill="#001673" opacity="0.7">Press Mentions Grid</text>
      <text x="36" y="688" font-size="11" fill="#5a627a" opacity="0.7">Content · Featured ·</text>
      <rect x="140" y="680" width="80" height="14" rx="7" fill="#fffbeb" stroke="#fcd34d" opacity="0.7"/>
      <text x="146" y="690" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5" opacity="0.7">SHARED GLOBAL</text>
      <text x="462" y="674" font-size="10" font-weight="800" fill="#8a94b3" text-anchor="end" letter-spacing="0.5">UNAVAILABLE</text>

      <!-- Row 8+: continues -->
      <line x1="0" y1="715" x2="480" y2="715" stroke="#e2e8f0"/>
      <text x="240" y="750" font-size="11" fill="#8a94b3" text-anchor="middle" font-style="italic">…scroll for 26 more rows…</text>
    </g>

    <!-- Footer strip -->
    <line x1="0" y1="794" x2="480" y2="794" stroke="#e2e8f0"/>
    <rect x="0" y="794" width="480" height="30" fill="#f4f6fd"/>
    <text x="18" y="813" font-size="11" fill="#5a627a"><tspan font-weight="600" fill="#001673">33</tspan> of 33 controls</text>

    <!-- Drawer shadow (approximated) -->
    <rect x="480" y="32" width="20" height="792" fill="url(#drawerShadow)"/>
    <defs>
      <linearGradient id="drawerShadow" x1="0" x2="1">
        <stop offset="0" stop-color="#000a36" stop-opacity="0.14"/>
        <stop offset="1" stop-color="#000a36" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Toolbar strip at the bottom -->
  <g>
    <rect x="500" y="850" width="440" height="40" rx="20" fill="#08122e"/>
    <circle cx="530" cy="870" r="12" fill="#08122e"/>
    <circle cx="562" cy="870" r="12" fill="#08122e"/>
    <circle cx="594" cy="870" r="12" fill="#08122e"/>
    <circle cx="626" cy="870" r="12" fill="#08122e"/>
    <rect x="640" y="862" width="1" height="16" fill="#3c4870"/>
    <circle cx="660" cy="870" r="14" fill="#ff5b21"/>
    <text x="660" y="874" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">☰</text>
    <text x="660" y="900" fill="#5a627a" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">NEW SLIDERS ICON</text>
    <rect x="680" y="862" width="1" height="16" fill="#3c4870"/>
    <circle cx="705" cy="870" r="12" fill="#08122e"/>
    <circle cx="737" cy="870" r="12" fill="#08122e"/>
    <circle cx="769" cy="870" r="12" fill="#08122e"/>
    <text x="880" y="874" fill="#8a94b3" font-size="9" text-anchor="end" letter-spacing="0.5">.dbvc-ve-toolbar (unchanged)</text>
  </g>

  <!-- Annotation -->
  <text x="1210" y="850" fill="#5a627a" font-size="10" text-anchor="end">1440 × 900 · wireframe placeholder</text>
</svg>
