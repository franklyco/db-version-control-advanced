<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1600" width="1280" height="1600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>R3 states.html gallery overview</title>
  <desc>Overview of the 17 labelled state cells in states.html. Each cell hosts one drawer state; the drawer is rendered inline (not viewport-fixed) so reviewers can compare states side-by-side.</desc>

  <rect x="0" y="0" width="1280" height="1600" fill="#dfe4f1"/>
  <text x="30" y="50" fill="#001673" font-size="22" font-weight="800">R3 Brand Control Center &#8212; state gallery</text>
  <text x="30" y="76" fill="#5a627a" font-size="13">17 labelled cells &#183; every drawer state referenced by the wiring schematic (§4 + §8)</text>

  <g font-size="12" fill="#001673">
    <!-- Row 1 -->
    <g>
      <rect x="30" y="110" width="380" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="132" font-weight="800">01 &#183; List (happy path, All tab)</text>
      <text x="40" y="150" font-size="10" fill="#5a627a">Default view. 33 rows. Sticky header.</text>
      <rect x="40" y="160" width="360" height="20" fill="#f6f7fd"/>
      <text x="50" y="175" font-size="10" fill="#5a627a">All · Brand · Contact · Design · Layout</text>
      <line x1="40" y1="200" x2="400" y2="200" stroke="#e2e8f0"/>
      <text x="40" y="220" font-size="11">Primary Logo</text>
      <rect x="350" y="212" width="40" height="16" rx="8" fill="#ff5b21"/>
      <text x="365" y="223" font-size="9" font-weight="600" fill="#ffffff">Open</text>
      <line x1="40" y1="240" x2="400" y2="240" stroke="#e2e8f0"/>
      <text x="40" y="260" font-size="11">Primary Phone</text>
      <rect x="350" y="252" width="40" height="16" rx="8" fill="#ff5b21"/>
      <text x="365" y="263" font-size="9" font-weight="600" fill="#ffffff">Open</text>
      <line x1="40" y1="280" x2="400" y2="280" stroke="#e2e8f0"/>
      <text x="40" y="300" font-size="11">Featured Posts</text>
      <rect x="350" y="292" width="40" height="16" rx="8" fill="#ff5b21"/>
      <text x="365" y="303" font-size="9" font-weight="600" fill="#ffffff">Open</text>
    </g>

    <g>
      <rect x="430" y="110" width="380" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="132" font-weight="800">02 &#183; Loading initial</text>
      <text x="440" y="150" font-size="10" fill="#5a627a">First open. aria-busy=true.</text>
      <circle cx="620" cy="300" r="12" fill="none" stroke="#ff5b21" stroke-width="3" stroke-dasharray="30 10"/>
      <text x="620" y="335" font-size="12" fill="#001673" text-anchor="middle">Loading Brand Controls…</text>
      <text x="620" y="355" font-size="10" fill="#5a627a" text-anchor="middle">Reading the registry snapshot.</text>
    </g>

    <g>
      <rect x="830" y="110" width="380" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="840" y="132" font-weight="800">03 &#183; Loading refresh</text>
      <text x="840" y="150" font-size="10" fill="#5a627a">List stays visible under dimmed overlay.</text>
      <line x1="840" y1="200" x2="1200" y2="200" stroke="#e2e8f0"/>
      <text x="840" y="220" font-size="11">Primary Logo</text>
      <line x1="840" y1="240" x2="1200" y2="240" stroke="#e2e8f0"/>
      <text x="840" y="260" font-size="11">Primary Phone</text>
      <rect x="830" y="160" width="380" height="310" fill="rgba(255,255,255,0.6)"/>
      <text x="1020" y="330" font-size="11" fill="#001673" text-anchor="middle">Refreshing…</text>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="30" y="490" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="512" font-weight="800">04 &#183; Empty registry</text>
      <text x="220" y="580" font-size="12" text-anchor="middle">No global controls are registered yet.</text>
      <text x="220" y="600" font-size="10" fill="#5a627a" text-anchor="middle">Providers register controls at boot.</text>
    </g>
    <g>
      <rect x="430" y="490" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="512" font-weight="800">05 &#183; Empty filtered</text>
      <text x="620" y="580" font-size="12" text-anchor="middle">No controls match these filters</text>
      <rect x="580" y="600" width="80" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="620" y="614" font-size="10" font-weight="600" fill="#001673" text-anchor="middle">Clear filters</text>
    </g>
    <g>
      <rect x="830" y="490" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="840" y="512" font-weight="800">06 &#183; Error</text>
      <rect x="880" y="560" width="280" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="900" y="580" font-size="11" fill="#be123c" font-weight="600">Could not load Brand Controls.</text>
      <text x="900" y="595" font-size="10" fill="#be123c">The registry request failed. Retryable.</text>
      <rect x="1080" y="632" width="70" height="22" rx="6" fill="#ff5b21"/>
      <text x="1115" y="646" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Retry</text>
    </g>

    <!-- Row 3 -->
    <g>
      <rect x="30" y="710" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="732" font-weight="800">07 &#183; Opening</text>
      <text x="40" y="750" font-size="10" fill="#5a627a">Row swaps Open → spinner + "Opening…". Row stays.</text>
      <line x1="40" y1="800" x2="400" y2="800" stroke="#e2e8f0"/>
      <text x="40" y="820" font-size="11">Featured Posts</text>
      <rect x="330" y="812" width="70" height="18" rx="8" fill="#ffc9b1"/>
      <text x="365" y="824" font-size="9" font-weight="600" fill="#001673" text-anchor="middle">Opening…</text>
    </g>
    <g>
      <rect x="430" y="710" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="732" font-weight="800">08 &#183; Drawer + panel coexist</text>
      <rect x="440" y="760" width="120" height="120" fill="#f6f7fd" stroke="#cbd5e1"/>
      <text x="500" y="810" font-size="9" text-anchor="middle" fill="#5a627a">Drawer</text>
      <rect x="580" y="760" width="220" height="120" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="690" y="810" font-size="10" text-anchor="middle" fill="#001673" font-weight="600">Main editor panel</text>
      <text x="690" y="828" font-size="9" text-anchor="middle" fill="#5a627a">(reused)</text>
    </g>
    <g>
      <rect x="830" y="710" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="840" y="732" font-weight="800">09 &#183; Open error (409 stale)</text>
      <line x1="840" y1="770" x2="1200" y2="770" stroke="#e2e8f0"/>
      <text x="840" y="790" font-size="11">Primary Phone</text>
      <rect x="840" y="810" width="360" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="852" y="828" font-size="10" fill="#be123c" font-weight="600">control_stale (409). Refresh to see the current list.</text>
      <rect x="1140" y="842" width="52" height="18" rx="4" fill="none" stroke="#be123c"/>
      <text x="1166" y="854" font-size="9" fill="#be123c" font-weight="600" text-anchor="middle">Dismiss</text>
    </g>

    <!-- Row 4 -->
    <g>
      <rect x="30" y="930" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="952" font-weight="800">10 &#183; All statuses</text>
      <text x="40" y="980" font-size="10" fill="#5a627a">One row of each: available, view only, unsupported, unavailable.</text>
      <g font-size="10">
        <circle cx="50" cy="1010" r="4" fill="#0f766e"/><text x="65" y="1013">Primary Logo · Open</text>
        <circle cx="50" cy="1030" r="4" fill="#1e3a8a"/><text x="65" y="1033">Short Bio · View</text>
        <circle cx="50" cy="1050" r="4" fill="#92400e"/><text x="65" y="1053" fill="#8a94b3">Accent Color · UNSUPPORTED</text>
        <circle cx="50" cy="1070" r="4" fill="orangered"/><text x="65" y="1073" fill="#8a94b3">Press Grid · UNAVAILABLE</text>
      </g>
    </g>
    <g>
      <rect x="430" y="930" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="952" font-weight="800">11 &#183; Category tab · Design</text>
      <text x="440" y="972" font-size="10" fill="#5a627a">Only Design controls shown. URL hash on the real thing.</text>
      <rect x="580" y="982" width="70" height="24" rx="12" fill="#001673"/>
      <text x="615" y="998" fill="#ffffff" font-size="11" text-anchor="middle">Design 6</text>
    </g>
    <g>
      <rect x="830" y="930" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="840" y="952" font-weight="800">12 &#183; Contact + filter chip</text>
      <rect x="840" y="972" width="70" height="24" rx="12" fill="#001673"/>
      <text x="875" y="988" fill="#ffffff" font-size="11" text-anchor="middle">Contact</text>
      <rect x="920" y="972" width="46" height="24" rx="12" fill="#001673"/>
      <text x="943" y="988" fill="#ffffff" font-size="11" text-anchor="middle">Must</text>
      <text x="1140" y="990" font-size="10" fill="#ff5b21" font-weight="600" text-anchor="end">Clear filters</text>
    </g>

    <!-- Row 5 -->
    <g>
      <rect x="30" y="1150" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="1172" font-weight="800">13 &#183; Sticky header, mid-scroll</text>
      <rect x="40" y="1190" width="360" height="20" fill="#f6f7fd"/>
      <text x="50" y="1205" font-size="10" fill="#5a627a" font-weight="800">CONTROL (pinned)</text>
      <line x1="40" y1="1230" x2="400" y2="1230" stroke="#e2e8f0"/>
      <text x="40" y="1250" font-size="11">Row 15…</text>
    </g>
    <g>
      <rect x="430" y="1150" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="1172" font-weight="800">14 &#183; Empty tab</text>
      <text x="620" y="1250" font-size="12" text-anchor="middle">No controls in Brand yet</text>
    </g>
    <g>
      <rect x="830" y="1150" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="840" y="1172" font-weight="800">15 &#183; Opening frame (partial slide)</text>
      <rect x="830" y="1150" width="200" height="200" rx="10" fill="#ffffff" stroke="#ff5b21" stroke-dasharray="4 4" opacity="0.6"/>
      <text x="930" y="1250" font-size="10" fill="#5a627a" text-anchor="middle">translateX(-45%)</text>
    </g>

    <!-- Row 6 -->
    <g>
      <rect x="30" y="1370" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="40" y="1392" font-weight="800">16 &#183; Reduced-motion open</text>
      <rect x="350" y="1382" width="60" height="16" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="380" y="1394" font-size="8" font-weight="800" fill="#1e3a8a" text-anchor="middle">MOTION OFF</text>
      <text x="220" y="1470" font-size="10" fill="#5a627a" text-anchor="middle">Transition suppressed under @media (prefers-reduced-motion: reduce)</text>
    </g>
    <g>
      <rect x="430" y="1370" width="380" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="440" y="1392" font-weight="800">17 &#183; Empty filtered in category</text>
      <text x="620" y="1470" font-size="12" text-anchor="middle">Legal tab + field=image → no matches</text>
    </g>
  </g>
</svg>
